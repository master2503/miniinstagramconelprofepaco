<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Publicaciones</ion-title>

    <ion-buttons slot="end">
      <ion-button id="upload-button" aria-label="Subir foto">
        <ion-icon slot="icon-only" name="camera"></ion-icon>
      </ion-button>

      <ion-button routerLink="/friends" aria-label="Amigos">
         <ion-icon slot="icon-only" name="people"></ion-icon>
      </ion-button>

      <ion-button (click)="logout()" aria-label="Cerrar sesión">
        <ion-icon slot="icon-only" name="log-out"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="light">

  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    accept="image/*"
    hidden
    (change)="onFileSelected($event)"
  />

  <!-- Popover para upload -->
  <ion-popover trigger="upload-button" side="bottom">
    <ng-template>
      <ion-content>
        <ion-list lines="none">
          <ion-item button (click)="captureFromCamera()">
            <ion-icon slot="start" name="camera"></ion-icon>
            <ion-label>Tomar foto</ion-label>
          </ion-item>
          <ion-item button (click)="triggerFileInput()">
            <ion-icon slot="start" name="images"></ion-icon>
            <ion-label>Elegir desde galería</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-popover>

  <div class="feed-container">
    <ion-card *ngFor="let p of posts" class="post-card">
      
      <!-- Header del post -->
      <ion-item lines="none">
        <!-- Se eliminó el carácter '|' que estaba aquí por error -->
        <ion-label>
          <h2>{{ p.user?.name || 'Usuario' }}</h2>
        </ion-label>
      </ion-item>

      <!-- Imagen -->
      <div class="post-image" [title]="p.user?.name + ' photo'">
        <!-- Usamos imgUrl para asegurar que siempre haya una imagen (fallback) -->
        <img 
          [src]="imgUrl(p.image_url)" 
          (error)="$event.target.src = $event.target.src.replace('/posts/', '/storage/posts/')"
          [alt]="p.user?.name + ' photo'" 
          role="img"
        />
      </div>

      <!-- Acciones -->
      <ion-row class="post-actions">
        <ion-col size="auto">
          <ion-icon
            [name]="p._liked ? 'heart' : 'heart-outline'"
            class="like-icon"
            (click)="toggleLike(p)">
          </ion-icon>
        </ion-col>
        <ion-col size="auto">
          <ion-icon
            name="chatbubble-outline"
            class="like-icon"
            (click)="toggleComments(p.id)">
          </ion-icon>
        </ion-col>
      </ion-row>

      <!-- Likes -->
      <div class="likes-text">
        {{ p.likes }} me gusta
      </div>

      <!-- Caption mejorado con nombre de usuario -->
      <div class="caption">
        <span class="username">{{ p.user?.name || 'Usuario' }}</span>
        <span class="text">{{ p.caption }}</span>
      </div>

      <!-- Sección de Comentarios (expandible) -->
      <div *ngIf="selectedPostId === p.id" class="comments-section">
        <!-- Comentarios existentes -->
        <div class="comments-list">
          <div *ngIf="!p.comments || p.comments.length === 0" class="no-comments">
            Sin comentarios aún. ¡Sé el primero!
          </div>
          <div *ngFor="let comment of p.comments" class="comment-item">
            <strong>{{ comment.user?.name || 'Usuario' }}:</strong>
            {{ comment.content }}
          </div>
        </div>

        <!-- Formulario para agregar comentario -->
        <div class="comment-form">
          <ion-item lines="none">
            <ion-input
              [(ngModel)]="commentText"
              placeholder="Escribe un comentario..."
              (keyup.enter)="submitComment(p)">
            </ion-input>
            <ion-button
              fill="clear"
              slot="end"
              (click)="submitComment(p)"
              [disabled]="!commentText.trim()">
              Enviar
            </ion-button>
          </ion-item>
        </div>
      </div>

      <!-- Botón para eliminar publicación -->
      <ion-button
        color="danger"
        fill="outline"
        (click)="deletePost(p.id)"
        aria-label="Eliminar publicación">
        <ion-icon slot="start" name="trash"></ion-icon>
        Eliminar
      </ion-button>
    </ion-card>
  </div>

</ion-content>
